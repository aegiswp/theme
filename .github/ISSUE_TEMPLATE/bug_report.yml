name: Bug Report
description: Report a general bug in the Aegis WordPress Block Theme.
labels:
  - "[Type] Bug"
  - triage
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for helping us improve the Aegis WordPress Block Theme.**

        **For accessibility barriers**, use the [Accessibility Report](https://github.com/aegiswp/theme/issues/new?template=accessibility_report.yml) template.
        **For bugs in a specific custom block**, use the [Block Issue](https://github.com/aegiswp/theme/issues/new?template=block_issue.yml) template.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: Where does this occur?
      options:
        - Frontend (Live Site)
        - Site Editor (Admin UI)
        - Block Editor
        - Both frontend and editor
    validations:
      required: true

  - type: dropdown
    id: affected-block
    attributes:
      label: Which block is affected? (if applicable)
      description: Theme-registered blocks live in src/Blocks/. core/video is enhanced by the theme, not a custom block.
      options:
        - "Not block-related"
        - Countdown
        - Related Posts
        - Slider
        - Slide
        - Toggle
        - Toggle Content
        - "core/video (enhanced)"
        - Multiple blocks
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Browser Console Logs
      description: Paste any red error text from F12 > Console here.
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### WordPress Environment"

  - type: input
    id: wp-version
    attributes:
      label: WordPress Version
      description: e.g., 7.0
    validations:
      required: true

  - type: input
    id: theme-version
    attributes:
      label: Theme Version
      description: e.g., 1.0.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      description: e.g., 8.2.10
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / Device / OS
      description: e.g., Chrome 124 on Windows 11
    validations:
      required: false

  - type: textarea
    id: active-plugins
    attributes:
      label: Active Plugins
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, stack traces, or any other details. Drag and drop files into this field.
    validations:
      required: false
