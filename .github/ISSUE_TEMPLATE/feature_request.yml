name: Feature Request
description: Suggest an idea for the Aegis WordPress Block Theme.
labels:
  - "[Type] Feature"
  - triage
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for suggesting an idea to improve the Aegis WordPress Block Theme.**
        Aegis prioritizes performance and vanilla standards. Please describe your suggestion below.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem or use case. If this is a pure enhancement, say so.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      description: What part of the theme does this primarily affect?
      options:
        - New Block
        - Existing Block Enhancement
        - Block Pattern (Layout)
        - Global Styles (theme.json / Design Tokens)
        - Template / Parts
        - Core Functionality (PHP / JS)
        - Documentation
        - Developer Tooling
    validations:
      required: true

  - type: dropdown
    id: block-type
    attributes:
      label: Block Type (if applicable)
      description: Theme-registered blocks are Countdown, Related Posts, Slider, Slide, Toggle, and Toggle Content. core/video is an enhanced core block.
      options:
        - "Not block-related"
        - Content Blocks (Countdown, Toggle, Related Posts)
        - Media Blocks (Slider, Slide, core/video)
        - Navigation Blocks
        - Layout Blocks
        - Utility Blocks
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
      description: What do you want to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you have considered
      description: Any alternative solutions or features you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here. Drag and drop files into this field.
    validations:
      required: false
