# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Accessibility Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accessibility-check:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: wordpress
      DB_USER: root
      DB_PASSWORD: root_password_ci
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: admin_password_ci
      WP_ADMIN_EMAIL: ci@example.com
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_ci
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Build theme
        run: npm run build

      - name: Set up WordPress
        run: |
          mkdir -p wp
          wp core download --path=wp
          wp config create --path=wp --dbname=${{ env.DB_NAME }} --dbuser=${{ env.DB_USER }} --dbpass=${{ env.DB_PASSWORD }} --dbhost=${{ env.DB_HOST }} --force
          wp db check --path=wp
          wp core install --path=wp --url=http://localhost:8080 --title="Aegis Test" --admin_user=${{ env.WP_ADMIN_USER }} --admin_password=${{ env.WP_ADMIN_PASSWORD }} --admin_email=${{ env.WP_ADMIN_EMAIL }} --skip-email
          ln -sfn "$GITHUB_WORKSPACE" wp/wp-content/themes/aegis
          wp theme activate aegis --path=wp
          # Ensure at least one post and one page exist (IDs resolved for pa11y below).
          if [ -z "$(wp post list --path=wp --post_type=post --posts_per_page=1 --field=ID 2>/dev/null)" ]; then
            wp post create --path=wp --post_type=post --post_title='Hello world!' --post_status=publish
          fi
          if [ -z "$(wp post list --path=wp --post_type=page --posts_per_page=1 --field=ID 2>/dev/null)" ]; then
            wp post create --path=wp --post_type=page --post_title='Sample Page' --post_name=sample-page --post_status=publish
          fi

      - name: Start PHP server
        run: php -S localhost:8080 -t wp > /dev/null 2>&1 &

      - name: Wait for server to start
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "✓ Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "✗ Server failed to start"
          exit 1

      # Query-string URLs: php -S does not rewrite pretty permalinks.
      # WCAG2AA via axe + htmlcs; threshold 0.
      - name: Run accessibility scan
        run: |
          POST_ID=$(wp post list --path=wp --post_type=post --posts_per_page=1 --orderby=ID --order=ASC --field=ID | head -n1)
          PAGE_ID=$(wp post list --path=wp --post_type=page --posts_per_page=1 --orderby=ID --order=ASC --field=ID | head -n1)
          if [ -z "$POST_ID" ] || [ -z "$PAGE_ID" ]; then
            echo "::error::Missing post or page ID for pa11y URL matrix (post=$POST_ID page=$PAGE_ID)"
            exit 1
          fi
          POST_ID="$POST_ID" PAGE_ID="$PAGE_ID" node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.pa11yci.json', 'utf8'));
            cfg.urls = [
              'http://localhost:8080/',
              'http://localhost:8080/?p=' + process.env.POST_ID,
              'http://localhost:8080/?s=test',
              'http://localhost:8080/?page_id=' + process.env.PAGE_ID,
              'http://localhost:8080/?p=999999'
            ];
            fs.writeFileSync('.pa11yci.ci.json', JSON.stringify(cfg, null, 2));
            console.log('pa11y URLs:', cfg.urls.join(', '));
          "
          npx pa11y-ci --config .pa11yci.ci.json --threshold 0
